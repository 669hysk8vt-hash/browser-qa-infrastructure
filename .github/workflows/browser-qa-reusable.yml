name: Browser QA infrastructure validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Print Playwright version
        run: npx playwright --version

      - name: Validate Playwright projects
        run: >-
          node -e "const config = require('./playwright.config.js');
          const expected = { 'chrome-stable': { browserName: 'chromium', channel: 'chrome' },
          'edge-stable': { browserName: 'chromium', channel: 'msedge' } };
          const projects = config.projects || [];
          if (projects.map(({ name }) => name).sort().join(',') !== Object.keys(expected).sort().join(','))
          throw new Error('Expected exactly the projects chrome-stable and edge-stable.');
          for (const project of projects) { const wanted = expected[project.name];
          if (project.use?.browserName !== wanted.browserName || project.use?.channel !== wanted.channel)
          throw new Error(project.name + ' must use browserName ' + wanted.browserName + ' and channel ' + wanted.channel + '.'); }
          console.log('Validated Playwright projects:', projects.map(({ name }) => name).join(', '));"
