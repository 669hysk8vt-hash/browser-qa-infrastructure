name: Browser QA infrastructure validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Print Windows version
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber

      - name: Print Node.js version
        run: node --version

      - name: Print npm version
        run: npm --version

      - name: Validate environment
        shell: pwsh
        run: |
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
            throw "Node.js is not available on PATH."
          }
          if (-not (Get-Command npm -ErrorAction SilentlyContinue)) {
            throw "npm is not available on PATH."
          }
          Write-Host "Windows infrastructure validation passed."

      - name: Install dependencies
        run: npm ci

      - name: Print Playwright version
        run: npx playwright --version

      - name: Validate Chrome stable project
        shell: pwsh
        run: |
          node -e "const config = require('./playwright.config'); const project = config.projects.find(({ name }) => name === 'chrome-stable'); if (!project || project.use.browserName !== 'chromium' || project.use.channel !== 'chrome') process.exit(1);"

      - name: Validate Edge stable project
        shell: pwsh
        run: |
          node -e "const config = require('./playwright.config'); const project = config.projects.find(({ name }) => name === 'edge-stable'); if (!project || project.use.browserName !== 'chromium' || project.use.channel !== 'msedge') process.exit(1);"

      - name: Validate installed branded browsers
        shell: pwsh
        run: |
          $browserCandidates = @{
            "Google Chrome" = @(
              "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe",
              "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
              "${env:LOCALAPPDATA}\Google\Chrome\Application\chrome.exe"
            )
            "Microsoft Edge" = @(
              "${env:ProgramFiles}\Microsoft\Edge\Application\msedge.exe",
              "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
              "${env:LOCALAPPDATA}\Microsoft\Edge\Application\msedge.exe"
            )
          }

          foreach ($expectedProductName in $browserCandidates.Keys) {
            $executable = $browserCandidates[$expectedProductName] |
              Where-Object { Test-Path -LiteralPath $_ } |
              Select-Object -First 1
            if (-not $executable) {
              throw "$expectedProductName executable was not found in a standard installation location."
            }

            $versionInfo = (Get-Item -LiteralPath $executable).VersionInfo
            Write-Host "$expectedProductName executable: $executable"
            Write-Host "$expectedProductName version: $($versionInfo.ProductVersion)"
            Write-Host "$expectedProductName ProductName: $($versionInfo.ProductName)"
            if ($versionInfo.ProductName -ne $expectedProductName) {
              throw "Expected ProductName '$expectedProductName' but found '$($versionInfo.ProductName)' at '$executable'."
            }
          }

      - name: Run branded browser self-test
        run: npx playwright test tests/self-test/infrastructure.spec.js --project=chrome-stable --project=edge-stable

      - name: Verify browser self-test artifacts
        if: always()
        shell: pwsh
        run: |
          $expectedArtifacts = @(
            "artifacts/self-test/chrome-stable.png",
            "artifacts/self-test/edge-stable.png",
            "artifacts/self-test/chrome-stable-identity.json",
            "artifacts/self-test/edge-stable-identity.json"
          )
          foreach ($artifact in $expectedArtifacts) {
            if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
              throw "Expected browser self-test artifact is absent: $artifact"
            }
          }

      - name: Upload browser self-test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-self-test
          path: artifacts/self-test/
          if-no-files-found: error
