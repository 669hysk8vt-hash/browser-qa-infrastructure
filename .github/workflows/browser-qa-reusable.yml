name: Browser QA infrastructure validation

on:
  workflow_call:
    inputs:
      test_command:
        description: Playwright test command to run in the caller repository
        required: false
        type: string
        default: npx playwright test
      working_directory:
        description: Directory containing the caller package and Playwright configuration
        required: false
        type: string
        default: .
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Print Windows version
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber

      - name: Print Node.js version
        run: node --version

      - name: Print npm version
        run: npm --version

      - name: Validate environment
        shell: pwsh
        run: |
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
            throw "Node.js is not available on PATH."
          }
          if (-not (Get-Command npm -ErrorAction SilentlyContinue)) {
            throw "npm is not available on PATH."
          }
          Write-Host "Windows infrastructure validation passed."

      - name: Install dependencies
        run: npm ci

      - name: Print Playwright version
        run: npx playwright --version

      - name: Validate Chrome stable project
        shell: pwsh
        run: |
          node -e "const config = require('./playwright.config'); const project = config.projects.find(({ name }) => name === 'chrome-stable'); if (!project || project.use.browserName !== 'chromium' || project.use.channel !== 'chrome') process.exit(1);"

      - name: Validate Edge stable project
        shell: pwsh
        run: |
          node -e "const config = require('./playwright.config'); const project = config.projects.find(({ name }) => name === 'edge-stable'); if (!project || project.use.browserName !== 'chromium' || project.use.channel !== 'msedge') process.exit(1);"

      - name: Validate installed branded browsers
        shell: pwsh
        run: |
          $browserCandidates = @{
            "Google Chrome" = @(
              "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe",
              "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
              "${env:LOCALAPPDATA}\Google\Chrome\Application\chrome.exe"
            )
            "Microsoft Edge" = @(
              "${env:ProgramFiles}\Microsoft\Edge\Application\msedge.exe",
              "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
              "${env:LOCALAPPDATA}\Microsoft\Edge\Application\msedge.exe"
            )
          }

          foreach ($expectedProductName in $browserCandidates.Keys) {
            $executable = $browserCandidates[$expectedProductName] |
              Where-Object { Test-Path -LiteralPath $_ } |
              Select-Object -First 1
            if (-not $executable) {
              throw "$expectedProductName executable was not found in a standard installation location."
            }

            $versionInfo = (Get-Item -LiteralPath $executable).VersionInfo
            Write-Host "$expectedProductName executable: $executable"
            Write-Host "$expectedProductName version: $($versionInfo.ProductVersion)"
            Write-Host "$expectedProductName ProductName: $($versionInfo.ProductName)"
            if ($versionInfo.ProductName -ne $expectedProductName) {
              throw "Expected ProductName '$expectedProductName' but found '$($versionInfo.ProductName)' at '$executable'."
            }
          }

      - name: Run branded browser self-test
        run: npx playwright test tests/self-test/infrastructure.spec.js --project=chrome-stable --project=edge-stable

      - name: Verify browser self-test artifacts
        shell: pwsh
        run: |
          $expectedArtifacts = @(
            "playwright-report/index.html",
            "artifacts/self-test/chrome-stable.png",
            "artifacts/self-test/edge-stable.png",
            "artifacts/self-test/chrome-stable-identity.json",
            "artifacts/self-test/edge-stable-identity.json",
            "artifacts/self-test/chrome-stable-indexeddb.json",
            "artifacts/self-test/edge-stable-indexeddb.json",
            "artifacts/self-test/chrome-stable-runtime.json",
            "artifacts/self-test/edge-stable-runtime.json",
            "artifacts/self-test/chrome-stable-1366x768.png",
            "artifacts/self-test/chrome-stable-1440x900.png",
            "artifacts/self-test/chrome-stable-1920x1080.png",
            "artifacts/self-test/edge-stable-1366x768.png",
            "artifacts/self-test/edge-stable-1440x900.png",
            "artifacts/self-test/edge-stable-1920x1080.png",
            "artifacts/self-test/chrome-stable-print.pdf",
            "artifacts/self-test/edge-stable-print.pdf",
            "artifacts/self-test/chrome-stable-print.json",
            "artifacts/self-test/edge-stable-print.json"
          )
          foreach ($artifact in $expectedArtifacts) {
            if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
              throw "Expected browser self-test artifact is absent: $artifact"
            }
          }

          $traceArchives = Get-ChildItem -Path "test-results" -Filter "*.zip" -File -Recurse -ErrorAction SilentlyContinue
          if (-not $traceArchives) {
            throw "No Playwright trace ZIP was found under test-results/."
          }
          $traceArchives | ForEach-Object { Write-Host "Playwright trace: $($_.FullName)" }

      - name: Upload browser self-test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-self-test
          path: artifacts/self-test/
          if-no-files-found: error

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: warn

  validate-caller:
    if: github.event_name == 'workflow_call'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - name: Check out caller repository
        uses: actions/checkout@v7

      - name: Set up Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json

      - name: Install caller dependencies
        run: npm ci

      - name: Print environment versions
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber
          node --version
          npm --version
          npx playwright --version

      - name: Validate installed branded browsers
        shell: pwsh
        run: |
          $browserCandidates = @{
            "Google Chrome" = @(
              "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe",
              "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
              "${env:LOCALAPPDATA}\Google\Chrome\Application\chrome.exe"
            )
            "Microsoft Edge" = @(
              "${env:ProgramFiles}\Microsoft\Edge\Application\msedge.exe",
              "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
              "${env:LOCALAPPDATA}\Microsoft\Edge\Application\msedge.exe"
            )
          }
          foreach ($expectedProductName in $browserCandidates.Keys) {
            $executable = $browserCandidates[$expectedProductName] |
              Where-Object { Test-Path -LiteralPath $_ } |
              Select-Object -First 1
            if (-not $executable) {
              throw "$expectedProductName executable was not found in a standard installation location."
            }
            $versionInfo = (Get-Item -LiteralPath $executable).VersionInfo
            Write-Host "$expectedProductName executable: $executable"
            Write-Host "$expectedProductName version: $($versionInfo.ProductVersion)"
            if ($versionInfo.ProductName -ne $expectedProductName) {
              throw "Expected branded browser '$expectedProductName', but found '$($versionInfo.ProductName)'."
            }
          }

      - name: Validate branded Playwright projects
        shell: pwsh
        run: |
          $reporter = Join-Path $env:RUNNER_TEMP "validate-branded-projects.cjs"
          @'
          class BrandedProjectReporter {
            onBegin(config) {
              const expected = new Map([
                ['chrome-stable', 'chrome'],
                ['edge-stable', 'msedge'],
              ]);
              for (const [name, channel] of expected) {
                const project = config.projects.find(candidate => candidate.name === name);
                if (!project)
                  throw new Error(`Missing required Playwright project: ${name}`);
                if (project.use.browserName !== 'chromium' || project.use.channel !== channel)
                  throw new Error(`${name} must use browserName chromium and channel ${channel}; generic Chromium is not allowed.`);
                console.log(`Validated ${name}: chromium / ${channel}`);
              }
            }
          }
          module.exports = BrandedProjectReporter;
          '@ | Set-Content -LiteralPath $reporter -Encoding utf8
          npx playwright test --list --reporter=$reporter

      - name: Run caller Playwright tests
        run: ${{ inputs.test_command }}

      - name: Upload caller Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ${{ inputs.working_directory }}/playwright-report/
          if-no-files-found: warn

      - name: Upload caller Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: ${{ inputs.working_directory }}/test-results/
          if-no-files-found: warn

      - name: Upload caller diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-qa-artifacts
          path: ${{ inputs.working_directory }}/artifacts/
          if-no-files-found: warn
