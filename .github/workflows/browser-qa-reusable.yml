name: Browser QA infrastructure validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Print Windows version
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber

      - name: Print Node.js version
        run: node --version

      - name: Print npm version
        run: npm --version

      - name: Validate environment
        shell: pwsh
        run: |
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
            throw "Node.js is not available on PATH."
          }
          if (-not (Get-Command npm -ErrorAction SilentlyContinue)) {
            throw "npm is not available on PATH."
          }
          Write-Host "Windows infrastructure validation passed."

      - name: Install dependencies
        run: npm ci

      - name: Print Playwright version
        run: npx playwright --version

      - name: Validate Chrome stable project
        shell: pwsh
        run: |
          node -e "const config = require('./playwright.config'); const project = config.projects.find(({ name }) => name === 'chrome-stable'); if (!project || project.use.browserName !== 'chromium' || project.use.channel !== 'chrome') process.exit(1);"

      - name: Validate Edge stable project
        shell: pwsh
        run: |
          node -e "const config = require('./playwright.config'); const project = config.projects.find(({ name }) => name === 'edge-stable'); if (!project || project.use.browserName !== 'chromium' || project.use.channel !== 'msedge') process.exit(1);"
