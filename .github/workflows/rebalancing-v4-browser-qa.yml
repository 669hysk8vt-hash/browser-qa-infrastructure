name: Rebalancing v4 browser QA

on:
  pull_request:
    paths:
      - 'rebalancing-v4/**'
      - '.github/workflows/rebalancing-v4-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-chrome-edge:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: rebalancing-v4/requirements_rebalancing_v4.txt

      - name: Set up Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r rebalancing-v4/requirements_rebalancing_v4.txt

      - name: Install Playwright dependencies
        run: npm ci

      - name: Python deterministic regression suite
        working-directory: rebalancing-v4
        run: python test_rebalancing_engine_v4.py

      - name: Browser E2E - Chrome Stable + Edge Stable
        working-directory: rebalancing-v4
        run: npx playwright test --config=playwright.config.js --project=chrome-stable --project=edge-stable

      - name: Upload rebalancing browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rebalancing-v4-browser-artifacts
          path: artifacts/rebalancing-v4/
          if-no-files-found: warn

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rebalancing-v4-playwright-report
          path: playwright-report-rebalancing-v4/
          if-no-files-found: warn

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rebalancing-v4-test-results
          path: rebalancing-v4/test-results/
          if-no-files-found: warn
